media:
  input: "static/img"
  output: "/img"

content:
  - name: "atalho-estoque"
    label: "🧑‍🍳 Atalho: Painel de Estoque"
    type: "file"
    path: "content/atalho-estoque.md"
    format: "yaml-frontmatter"
    fields:
      - name: "body"
        label: "Endereço (copie e cole no navegador)"
        type: "text"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "never"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "never"
            hidden: true

  - name: "atalho-analytics"
    label: "📊 Atalho: Estatísticas do Site"
    type: "file"
    path: "content/atalho-analytics.md"
    format: "yaml-frontmatter"
    fields:
      - name: "body"
        label: "Endereço (copie e cole no navegador)"
        description: "Se pedir login, entre com a conta da Cloudflare de sempre."
        type: "text"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "never"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "never"
            hidden: true

  - name: "profile"
    label: "Perfil"
    type: "file"
    path: "content/_index.md"
    format: "yaml-frontmatter"
    fields:
      - name: "title"
        label: "Nome do negócio"
        type: "string"
        required: true
      - name: "bio"
        label: "Biografia / descrição curta"
        type: "text"
      - name: "foto_perfil"
        label: "Foto de perfil"
        type: "image"
      - name: "instagram_url"
        label: "URL do Instagram"
        type: "string"
      - name: "whatsapp_url"
        label: "URL do WhatsApp"
        type: "string"
      - name: "chave_pix"
        label: "Chave Pix (ou Pix copia e cola)"
        type: "string"
      - name: "video_youtube_url"
        label: "Link do vídeo no YouTube (opcional)"
        type: "string"
      - name: "video_titulo"
        label: "Título/legenda do vídeo (opcional)"
        type: "string"
      - name: "google_avaliacao_url"
        label: "Link para avaliar no Google (opcional)"
        type: "string"
      - name: "tema_cor"
        label: "Tema de cor do site"
        type: "select"
        default: "marrom"
        options:
          values:
            - value: "marrom"
              label: "Marrom/Bege (padrão)"
            - value: "verde"
              label: "Verde"
            - value: "rosa"
              label: "Rosa"
            - value: "azul"
              label: "Azul"

  - name: "links"
    label: "Links"
    type: "collection"
    path: "content/links"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "slug"
        label: "Identificador (slug)"
        type: "string"
        required: true
      - name: "title"
        label: "Título do link"
        type: "string"
        required: true
      - name: "link_url"
        label: "URL de destino"
        type: "string"
        required: true
      - name: "icone"
        label: "Ícone (classe Font Awesome, opcional)"
        type: "string"
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true

  - name: "categorias"
    label: "Categorias do Catálogo"
    type: "collection"
    path: "content/categorias"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      default:
        sort: "title"
        order: "asc"
    fields:
      - name: "title"
        label: "Nome da categoria"
        type: "string"
        required: true
      - name: "ativo"
        label: "Categoria ativa (desligue para esconder todos os produtos dela de uma vez)"
        type: "boolean"
        default: true

  - name: "produtos"
    label: "Produtos do Catálogo"
    type: "collection"
    path: "content/produtos"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "slug"
        label: "Identificador (slug)"
        type: "string"
        required: true
      - name: "title"
        label: "Nome do produto"
        type: "string"
        required: true
      - name: "preco"
        label: "Preço (em reais, ex: 12.50)"
        type: "number"
        required: true
      - name: "codigo"
        label: "Código do produto (ex: 001, 002 — você escolhe)"
        type: "string"
      - name: "em_promocao"
        label: "Produto em promoção?"
        type: "boolean"
        default: false
      - name: "preco_promocional"
        label: "Preço promocional (em reais, ex: 9.90 — só vale se 'Produto em promoção' estiver ligado)"
        type: "number"
      - name: "foto"
        label: "Foto do produto"
        type: "image"
      - name: "descricao"
        label: "Descrição"
        type: "text"
      - name: "cores"
        label: "Cores disponíveis (texto livre, ex: Azul, Verde)"
        type: "string"
      - name: "tamanho"
        label: "Tamanhos disponíveis (texto livre, ex: P, M, G)"
        type: "string"
      - name: "categoria"
        label: "Categoria"
        type: "reference"
        required: true
        options:
          collection: "categorias"
          value: "{fields.title}"
          label: "{fields.title}"
      - name: "estoque"
        label: "Estoque (apenas informativo)"
        type: "number"
      - name: "ativo"
        label: "Produto ativo (aparece no catálogo)"
        type: "boolean"
        default: true
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true

  - name: "galeria"
    label: "Galeria de Fotos"
    type: "collection"
    path: "content/galeria"
    format: "yaml-frontmatter"
    view:
      primary: "legenda"
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "foto"
        label: "Foto"
        type: "image"
        required: true
      - name: "legenda"
        label: "Legenda (opcional)"
        type: "text"
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true
