<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento aprovado · Padaria Vila Nova</title>
<style>
  :root { --primary: #8B4513; --secondary: #F5DEB3; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, var(--secondary) 0%, #fff8ec 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #4a3421;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .icone { font-size: 3rem; margin-bottom: 8px; }
  h1 { color: #2e7d32; margin: 0 0 8px; font-size: 1.4rem; }
  p { line-height: 1.5; margin: 0 0 20px; }
  a.btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icone">✅</div>
    <h1>Pagamento aprovado!</h1>
    <p>Seu pedido foi confirmado. A padaria já foi avisada e vai preparar tudo certinho.</p>
    <a class="btn" href="/">Voltar para o site</a>
  </div>
  <script>
    try { localStorage.removeItem('pvn_cart'); } catch (e) {}
  </script>
</body>
</html>
